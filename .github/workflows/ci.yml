name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install nanoarrow (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: brew install nanoarrow

      - name: Build nanoarrow 0.9.0 from source (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          # Build outside the workspace: a linked package directory must not
          # contain stray subdirectories (raco setup scans them as collections).
          work=$(mktemp -d)
          curl -sL -o "$work/nanoarrow.tar.gz" \
            https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-0.9.0.tar.gz
          mkdir "$work/src" && tar xzf "$work/nanoarrow.tar.gz" -C "$work/src" --strip-components=1
          cmake -S "$work/src" -B "$work/build" \
            -DNANOARROW_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$work/build" --config Release
          cmake --install "$work/build" --prefix "$HOME/.nanoarrow"
          rm -rf "$work"

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          # arm64 on macOS: brew's libnanoarrow is arm64-only, and an x64
          # Racket (the action default) cannot dlopen it.
          architecture: ${{ matrix.os == 'macos-latest' && 'arm64' || 'x64' }}
          version: stable

      - name: Configure library search path (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib" >> "$GITHUB_ENV"

      - name: Configure library search path (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LD_LIBRARY_PATH=$HOME/.nanoarrow/lib" >> "$GITHUB_ENV"

      - name: Install package
        run: raco pkg install --auto --link "$(pwd)"

      - name: Run tests
        run: raco test -p nanoarrow
